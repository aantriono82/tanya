baseURL = "https://tanya.aantriono.com/"
locale = "id-ID"
defaultContentLanguage = "id"
title = "Tanya Jawab Islam"
summary = "Menjawab pertanyaan seputar Islam dengan dalil, tenang, dan mudah dipahami."
enableRobotsTXT = true

[params]
  tagline = "Menjawab pertanyaan seputar Islam dengan dalil, tenang, dan mudah dipahami."
  description = "Tanya Jawab Islam — situs tanya jawab seputar Islam yang dikelola Aan Triono. Pertanyaan diseleksi, dijawab berdasar Al-Qur'an dan hadis, ditinjau, lalu diterbitkan."
  pengelola = "Aan Triono"
  # Isi dengan access key Web3Forms milik Mas Aan (kunci publik formulir, aman tampil di HTML).
  # Selama kosong, formulir menampilkan pemberitahuan "belum aktif" dan tombol kirim nonaktif.
  web3formsKey = "12a51930-f832-4f2a-b1af-2987ac31e458"
  # Tombol "Jawaban ini membantu" mengirim satu email Web3Forms per klik dan memakai
  # kuota yang sama dengan formulir Bertanya/Koreksi. Ubah ke true untuk menampilkannya.
  tombolMembantu = false
  # Alamat situs blog utama (payung)
  blogUtama = "https://www.aantriono.com/"

# Hanya kategori yang punya halaman sendiri. `tags` tetap ditulis di front matter dan
# dipakai untuk "Tanya Terkait" serta indeks pencarian, tetapi tidak dibuatkan halaman
# /tags/… (halaman tipis berisi 1–2 jawaban, tidak ditautkan dari mana pun).
[taxonomies]
  kategori = "kategori"

# Penentu "Tanya Terkait": jawaban dengan tag/kategori paling mirip didahulukan.
[related]
  includeNewer = true
  threshold = 1
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "kategori"
    weight = 60

# Tanggal pembaruan diambil dari kolom `lastmod` di front matter (diisi manual saat
# merevisi). Sengaja tidak memakai Git: build Cloudflare bisa memakai clone dangkal
# sehingga semua halaman tampak "diperbarui" setiap deploy.
[frontmatter]
  lastmod = ["lastmod", "date"]

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    name = "Beranda"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Kategori"
    url = "/kategori/"
    weight = 2
  [[menu.main]]
    name = "Semua Tanya Jawab"
    url = "/tanya-jawab/"
    weight = 3
  [[menu.main]]
    name = "Tentang"
    url = "/tentang/"
    weight = 4
